{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ben Holt | Full Stack Developer</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            opacity: 0;
            animation: fadeInUp 1.2s ease 0.2s forwards;
        }

        .scroll-fade {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .scroll-fade.visible {
            opacity: 1;
            transform: translateY(0);
        }

        html {
            scroll-behavior: smooth;
        }

        .year-item {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            height: 80px;
            justify-content: center;
        }

        .year-label-above {
            position: absolute;
            top: 0;
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
            transition: color 0.25s ease;
        }

        .year-label-below {
            position: absolute;
            bottom: 0;
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
            transition: color 0.25s ease;
        }

        .year-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }

        .cards-wrapper {
            opacity: 0;
            transform: translateY(16px);
            transition: all 0.4s ease;
        }

        .cards-wrapper.active {
            opacity: 1;
            transform: translateY(0);
        }

        .cards-wrapper.exit {
            opacity: 0;
            transform: translateY(-8px);
        }

        @media (max-width: 768px) {
            .year-track {
                display: none !important;
            }

            .mobile-nav {
                display: flex !important;
            }
        }
    </style>
    <script src="{% static 'js/cv.js' %}" defer></script>
</head>

<body>
    {% block content %}
    {% endblock %}
</body>

</html>
